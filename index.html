<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Unidades</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topo">
  <img 
    src="https://casp.com.br/wp-content/uploads/2023/07/CASP-logo-branco-fundo-transparente-menor.png" 
    alt="Logo CASP"
    class="logo-casp"
  >
  
  <span class="titulo-topo">Conversor de Unidades</span>
  </header>

  <main class="container">
    <h1>Conversor de Unidades</h1>

    <label for="grandeza">Grandeza</label>
    <select id="grandeza">
      <option value="">Selecione</option>
      <option value="potencia">Potência</option>
      <option value="energia">Energia</option>
      <option value="pressao">Pressão</option>
      <option value="velocidade">Velocidade</option>
      <option value="tempo">Tempo</option>
      <option value="medida">Medida</option>
      <option value="area">Área</option>
      <option value="volume">Volume</option>
      <option value="peso">Peso</option>
    </select>

    <label for="valor">Valor</label>
    <input type="number" id="valor" placeholder="Digite o valor">

    <label for="de">De</label>
    <select id="de"></select>

    <label for="para">Para</label>
    <select id="para"></select>

    <button id="btnConverter">Converter</button>

    <div class="resultado" id="resultado">
      Resultado aparecerá aqui!
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
